name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      site_content:
        description: 'Le code HTML du site'
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Create site file
        env:
          SITE_HTML: ${{ github.event.inputs.site_content }}
        run: printf '%s' "$SITE_HTML" > index.html
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=lova-site
