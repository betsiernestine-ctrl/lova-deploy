name: Deploy to Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      site_content:
        description: 'Le code HTML du site'
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create public folder
        run: mkdir -p public
      - name: Write HTML file
        env:
          SITE_CONTENT: ${{ github.event.inputs.site_content }}
        run: |
          node -e "require('fs').writeFileSync('public/index.html', process.env.SITE_CONTENT)"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=lova-site
